<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23f59e0b%27/%3E%3Cpath d=%27M18 4 8 18h6l-2 10 10-14h-6z%27 fill=%27%230f172a%27/%3E%3C/svg%3E" />
    <script>
      // Apply the saved or device theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('ess-training:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
    <title>ESS Training - Lion Energy Sanctuary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
